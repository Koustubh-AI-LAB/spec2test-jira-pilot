version: 2
# Routine version-update PRs are turned off (open-pull-requests-limit: 0).
# Dependabot security updates are unaffected: they have their own limit and
# still open PRs for dependencies with known vulnerabilities.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
