name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Security issues must not be filed here** — see SECURITY.md.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - service (State Service / Jira)
        - runner (codegen / validator / fault injection)
        - plugin (skill / s2t CLI / prompts)
        - docs / tooling
        - not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Command output or logs. Remove tokens, emails and other secrets first.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node version, Postgres version
    validations:
      required: true
