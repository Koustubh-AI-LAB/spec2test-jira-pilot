# Local Postgres for the State Service.
#
# Port 5435 rather than 5432, deliberately: a developer machine often already
# runs another Postgres, and a port collision shows up as a silent connection
# to the wrong database, not a clear error. The tests expect 5435.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: spec2test
      POSTGRES_PASSWORD: spec2test
      POSTGRES_DB: spec2test
    ports:
      - '5435:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spec2test']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
